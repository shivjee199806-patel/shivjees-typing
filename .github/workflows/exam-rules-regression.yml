name: Exam Rules Regression
on:
  pull_request:
    paths:
      - 'server.js'
      - 'tests/exam-rule-smoke.test.js'
      - '.github/workflows/exam-rules-regression.yml'
  workflow_dispatch:
jobs:
  test-exam-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check server syntax
        run: node --check server.js
      - name: Test exam rules
        run: node --test tests/exam-rule-smoke.test.js
